# This is a Declarative Automation Bundle definition for end_to_end_dp.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: end_to_end_dp
  uuid: 94eee09a-a51a-429c-ad93-a88a91718544

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0fa3124b-b4b4.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-0fa3124b-b4b4.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/paulcoffi2002@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/paulcoffi2002@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: paulcoffi2002@gmail.com
        level: CAN_MANAGE
